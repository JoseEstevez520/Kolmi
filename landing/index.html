<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolmi · Aprende en colmena</title>
    <meta
      name="description"
      content="Kolmi es donde una clase junta sus apuntes: cada uno deja los suyos y, cada noche, una IA los convierte en páginas compartidas que la clase puede leer y a las que puede preguntar."
    />
    <script>
      // The theme chosen with ThemeToggle, before the first paint (elastic-ui USAGE 16).
      try {
        const theme = localStorage.getItem('elastic-ui.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

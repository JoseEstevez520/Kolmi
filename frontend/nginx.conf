# A single-page app: any path that isn't a real file falls back to index.html, so Vue
# Router's history mode (no #) works on a refresh or a direct link.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets (hashed filenames): safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# A single-page app: any path that isn't a real file falls back to index.html, so Vue
# Router's history mode (no #) works on a refresh or a direct link. /api/ reverse-proxies
# to the backend container, so the browser sees one origin: no CORS, one Funnel port.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Notes can carry a file up to 20 MB (backend/app/files.py); nginx's 1M default
    # would reject the upload before it ever reaches the API.
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets (hashed filenames): safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
